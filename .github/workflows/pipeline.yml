# One pipeline for everything: every pull request is checked; every push to
# main is checked and then deployed. The deploy uses exactly the files that
# passed the checks.
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site:
    name: Site (format, lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  infra:
    name: Infra (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false
      - run: tofu validate
      - name: Security scan (checkov)
        run: pipx run checkov --directory . --framework terraform --compact --quiet

  deploy:
    name: Deploy to AWS
    # DEPLOY_ENABLED is a repository variable set in docs/SETUP.md step 8,
    # once AWS exists. Until then this job is skipped instead of failing.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: [secrets, site, infra]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write # lets GitHub issue the short-lived OIDC token for AWS
    env:
      AWS_REGION: ca-central-1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload hashed assets (cached for a year)
        run: >
          aws s3 sync dist/assets "s3://${{ secrets.SITE_BUCKET }}/assets"
          --delete --only-show-errors
          --cache-control "public,max-age=31536000,immutable"
      - name: Upload pages (always revalidated)
        run: >
          aws s3 sync dist "s3://${{ secrets.SITE_BUCKET }}"
          --delete --only-show-errors --exclude "assets/*"
          --cache-control "public,max-age=0,must-revalidate"
      - name: Invalidate CDN cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*" > /dev/null
